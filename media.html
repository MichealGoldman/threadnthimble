<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Library</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
    --line: #e4e2dd; --accent: #3b5bdb; --accent-soft: #e7ecff; --hover: #f1f0ec;
    --warn: #b4540a; --warn-soft: #fdecdc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --panel: #1c1c1f; --text: #ececf0; --muted: #9a9aa3;
      --line: #2c2c31; --accent: #8ea4ff; --accent-soft: #252c47; --hover: #232327;
      --warn: #f0a35e; --warn-soft: #3a2a1c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 28px 16px 60px; }
  h1 { font-size: 26px; margin: 0 0 2px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  .tab {
    background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
    padding: 10px 14px; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer;
  }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .count {
    display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 10px;
    font-size: 12px; font-weight: 600; background: var(--hover); color: var(--muted);
  }
  .tab[aria-selected="true"] .count { background: var(--accent-soft); color: var(--accent); }

  .tools { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  input[type="search"] {
    flex: 1; min-width: 200px; padding: 9px 12px; font: inherit; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; outline: none;
  }
  input[type="search"]:focus { border-color: var(--accent); }
  .shown { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .toggle {
    font: inherit; font-size: 13px; padding: 8px 12px; border-radius: 8px; cursor: pointer;
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
  }
  .toggle:hover { background: var(--hover); }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--muted); font-weight: 600; padding: 10px 14px; border-bottom: 1px solid var(--line);
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  th:hover { color: var(--text); }
  th .arrow { color: var(--accent); }
  td { padding: 8px 14px; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--hover); }
  .num { text-align: right; width: 110px; font-variant-numeric: tabular-nums; color: var(--muted); }

  details { border-bottom: 1px solid var(--line); }
  details:last-child { border-bottom: 0; }
  summary {
    list-style: none; cursor: pointer; padding: 10px 14px;
    display: flex; justify-content: space-between; gap: 12px;
  }
  summary::-webkit-details-marker { display: none; }
  summary:hover { background: var(--hover); }
  summary .name::before { content: "▸"; display: inline-block; width: 16px; color: var(--muted); transition: transform .15s; }
  details[open] summary .name::before { transform: rotate(90deg); }
  summary .n { color: var(--muted); font-size: 13px; white-space: nowrap; }
  details ul { margin: 0; padding: 2px 14px 10px 44px; color: var(--muted); }
  details li { padding: 2px 0; }

  /* Seasons nested inside a show */
  .seasons { padding: 0 14px 10px 30px; }
  .seasons details { border: 1px solid var(--line); border-radius: 8px; margin-top: 6px; }
  .seasons details:last-child { border-bottom: 1px solid var(--line); }
  .seasons summary { padding: 7px 12px; font-size: 14px; }
  .seasons details ul { padding: 0 12px 8px 40px; }
  .ep { display: flex; gap: 10px; }
  .ep .code { font-variant-numeric: tabular-nums; font-size: 12px; min-width: 56px; padding-top: 2px; }
  .ep .title { color: var(--text); }

  /* Missing seasons / episodes */
  .src { font-size: 12px; color: var(--muted); padding: 2px 0 2px; }
  .src a { color: var(--accent); }
  .badge {
    display: inline-block; margin-right: 8px; padding: 0 7px; border-radius: 10px;
    font-size: 12px; font-weight: 600; background: var(--warn-soft); color: var(--warn);
  }
  .ep.missing .title, .ep.missing .code { color: var(--muted); opacity: .75; }
  .ep.missing .title { font-style: italic; }
  .flag { font-style: normal; font-size: 11px; font-weight: 600; color: var(--warn); text-transform: uppercase; letter-spacing: .03em; margin-left: 4px; }
  .flag.review { color: var(--accent); }
  .badge.review { background: var(--accent-soft); color: var(--accent); }
  .seasons details.gone { border-style: dashed; }
  .seasons details.gone > summary .name { color: var(--muted); }
  .toggle[aria-pressed="true"] { background: var(--warn-soft); color: var(--warn); border-color: transparent; }

  mark { background: var(--accent-soft); color: inherit; border-radius: 2px; }
  .empty { padding: 28px; text-align: center; color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Media Library</h1>
  <div class="sub" id="sub"></div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="movies">Movies<span class="count" id="c-movies"></span></button>
    <button class="tab" role="tab" data-tab="shows">Shows<span class="count" id="c-shows"></span></button>
    <button class="tab" role="tab" data-tab="music">Music<span class="count" id="c-music"></span></button>
  </div>

  <div class="tools">
    <input type="search" id="q" placeholder="Search…" autocomplete="off">
    <button class="toggle" id="incomplete" aria-pressed="false" hidden>Show only incomplete</button>
    <button class="toggle" id="expand" hidden>Expand all</button>
    <span class="shown" id="shown"></span>
  </div>

  <div class="panel" id="view"></div>
</div>

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hl = (s, q) => {
  if (!q) return esc(s);
  const i = s.toLowerCase().indexOf(q);
  if (i < 0) return esc(s);
  return esc(s.slice(0, i)) + "<mark>" + esc(s.slice(i, i + q.length)) + "</mark>" + esc(s.slice(i + q.length));
};
// Name the conversion pipeline wasn't sure of; the file carries "--needs name review--".
const REVIEW_FLAG = ` <span class="flag review" title="Identified with low confidence; check the name">needs review</span>`;
const cmpText =(a, b) => a.localeCompare(b, undefined, { sensitivity: "base", numeric: true });

const state = { tab: "movies", q: "", sort: { movies: ["t", 1] }, expanded: false, incomplete: false };
const view = document.getElementById("view");
const shown = document.getElementById("shown");
const qInput = document.getElementById("q");
const expandBtn = document.getElementById("expand");
const incompleteBtn = document.getElementById("incomplete");

document.getElementById("sub").textContent = "Scanned from M:\\ on " + DATA.date;
document.getElementById("c-movies").textContent = DATA.movies.length;
document.getElementById("c-shows").textContent = DATA.shows.length;
document.getElementById("c-music").textContent = DATA.music.length;

function sorted(list, [key, dir]) {
  return [...list].sort((a, b) => {
    const x = a[key], y = b[key];
    if (x == null && y == null) return cmpText(a.t, b.t);
    if (x == null) return 1;
    if (y == null) return -1;
    const r = typeof x === "number" ? x - y : cmpText(x, y);
    return (r || cmpText(a.t, b.t)) * (r ? dir : 1);
  });
}

function table(tab, cols, rows) {
  const [sk, sd] = state.sort[tab];
  const head = cols.map(c =>
    `<th data-key="${c.key}" class="${c.num ? "num" : ""}">${c.label}` +
    (sk === c.key ? ` <span class="arrow">${sd > 0 ? "▲" : "▼"}</span>` : "") + "</th>").join("");
  const body = rows.map(r => "<tr>" + cols.map(c =>
    `<td class="${c.num ? "num" : ""}">${c.render(r)}</td>`).join("") + "</tr>").join("");
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

function render() {
  const q = state.q;
  let html = "", n = 0, total = DATA[state.tab].length;
  expandBtn.hidden = state.tab === "movies";
  incompleteBtn.hidden = state.tab !== "shows";

  if (state.tab === "movies") {
    const rows = sorted(DATA.movies.filter(m => !q || m.t.toLowerCase().includes(q) || String(m.y).includes(q)), state.sort.movies);
    n = rows.length;
    html = table("movies", [
      { key: "t", label: "Title", render: r => hl(r.t, q) + (r.r ? REVIEW_FLAG : "") },
      { key: "y", label: "Year", num: true, render: r => r.y ?? "—" },
    ], rows);
  } else if (state.tab === "shows") {
    const plural = (k, w) => `${k} ${w}${k === 1 ? "" : "s"}`;
    const seasonName = n => n === 0 ? "Specials" : "Season " + n;
    const missingIn = eps => eps.filter(ep => ep.m).length;
    const rows = DATA.shows
      .filter(s => !state.incomplete || s.seasons.some(se => missingIn(se.e)))
      .map(s => {
        const showHit = !q || s.t.toLowerCase().includes(q);
        const seasons = s.seasons
          .map(se => ({ ...se, e: showHit ? se.e : se.e.filter(ep => ep.t.toLowerCase().includes(q) || ep.c.toLowerCase().includes(q)) }))
          .filter(se => se.e.length);
        return (showHit || seasons.length) ? { ...s, seasons, open: !!q && !showHit } : null;
      })
      .filter(Boolean);
    n = rows.length;
    total = state.incomplete ? DATA.shows.filter(s => s.seasons.some(se => missingIn(se.e))).length : total;
    html = rows.map(s => {
      const full = DATA.shows.find(x => x.t === s.t).seasons;
      // Seasons/episodes actually on disk, not counting the ones flagged missing
      const owned = full.filter(se => se.n > 0 && se.e.some(ep => !ep.m));
      const eps = full.reduce((k, se) => k + se.e.length - missingIn(se.e), 0);
      const specials = full.some(se => se.n === 0) ? " + specials" : "";
      const missing = full.reduce((k, se) => k + missingIn(se.e), 0);
      const review = full.reduce((k, se) => k + se.e.filter(ep => ep.r).length, 0);
      const badge = (missing ? `<span class="badge">${missing} missing</span>` : "") +
        (review ? `<span class="badge review">${review} to review</span>` : "");
      const src = !s.src ? "No episode list found, so only gaps between episodes you have are flagged"
        : s.src.url ? `Checked against ${esc(s.src.via)}: <a href="${esc(s.src.url)}" target="_blank" rel="noopener">${esc(s.src.name)}</a>`
        : `Checked against ${esc(s.src.via)}: ${esc(s.src.name)}`;
      return `
      <details${s.open || state.expanded ? " open" : ""}>
        <summary><span class="name">${hl(s.t, q)}</span><span class="n">${badge}${plural(owned.length, "season")}${specials} · ${plural(eps, "episode")}</span></summary>
        <div class="seasons">
          <div class="src">${src}</div>${s.seasons.map(se => {
            const m = missingIn(se.e), all = se.e.length;
            const info = m === all ? `<span class="badge">not on disk · ${plural(all, "episode")}</span>`
              : m ? `<span class="badge">${m} missing</span>${all - m} of ${all}`
              : plural(all, "episode");
            return `
          <details class="${m === all ? "gone" : ""}"${s.open || state.expanded ? " open" : ""}>
            <summary><span class="name">${seasonName(se.n)}</span><span class="n">${info}</span></summary>
            <ul>${se.e.map(ep => `<li class="ep${ep.m ? " missing" : ""}"><span class="code">${esc(ep.c)}</span><span class="title">${ep.t ? hl(ep.t, q) : "Unknown title"}${ep.m ? ` <span class="flag">missing</span>` : ""}${ep.r ? REVIEW_FLAG : ""}</span></li>`).join("")}</ul>
          </details>`;
          }).join("")}
        </div>
      </details>`;
    }).join("");
  } else {
    const rows = DATA.music
      .map(a => {
        const artistHit = !q || a.t.toLowerCase().includes(q);
        const albums = artistHit ? a.a : a.a.filter(x => x.toLowerCase().includes(q));
        return (artistHit || albums.length) ? { ...a, a: albums, open: !!q && !artistHit } : null;
      })
      .filter(Boolean);
    n = rows.length;
    html = rows.map(a => `
      <details${a.open || state.expanded ? " open" : ""}>
        <summary><span class="name">${hl(a.t, q)}</span><span class="n">${a.a.length} ${a.a.length === 1 ? "album" : "albums"}</span></summary>
        <ul>${a.a.map(x => `<li>${hl(x, q)}</li>`).join("")}</ul>
      </details>`).join("");
  }

  view.innerHTML = n ? html : `<div class="empty">${q ? `Nothing matches “${esc(q)}”` : "Nothing to show"}</div>`;
  shown.textContent = q ? `${n} of ${total}` : state.tab === "shows" && state.incomplete ? `${n} incomplete` : "";
}

document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
  state.tab = b.dataset.tab;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t === b));
  try { localStorage.setItem("media-tab", state.tab); } catch {}
  render();
}));

view.addEventListener("click", e => {
  const th = e.target.closest("th");
  if (!th) return;
  const s = state.sort[state.tab];
  if (s[0] === th.dataset.key) s[1] = -s[1];
  else { s[0] = th.dataset.key; s[1] = th.dataset.key === "t" ? 1 : -1; }
  render();
});

qInput.addEventListener("input", () => { state.q = qInput.value.trim().toLowerCase(); render(); });
incompleteBtn.addEventListener("click", () => {
  state.incomplete = !state.incomplete;
  incompleteBtn.setAttribute("aria-pressed", state.incomplete);
  render();
});
expandBtn.addEventListener("click", () => {
  state.expanded = !state.expanded;
  expandBtn.textContent = state.expanded ? "Collapse all" : "Expand all";
  render();
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== qInput) { e.preventDefault(); qInput.focus(); }
  if (e.key === "Escape" && document.activeElement === qInput) { qInput.value = ""; state.q = ""; render(); }
});

let start = "movies";
try { start = localStorage.getItem("media-tab") || "movies"; } catch {}
(document.querySelector(`.tab[data-tab="${start}"]`) || document.querySelector(".tab")).click();
</script>
